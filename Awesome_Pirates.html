<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fullscreen Flash with Ruffle</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

#player {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    player.style.position = "absolute";
    player.style.top = "0";
    player.style.left = "0";
    player.style.width = "100vw";
    player.style.height = "100vh";

    document.getElementById("player").appendChild(player);

    player.load({
        url: "Awesome_Pirates.swf"
    });
});
</script>

</body>
</html>
